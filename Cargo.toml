[package]
name = "content-storage-service"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
actix-web = "4.12.1"
actix-multipart = "0.7.2"

# gRPC
tonic = "0.14.2"
tonic-prost = "0.14.2"
prost = "0.14.1"
prost-types = "0.14.1"

# Async runtime
tokio = { version = "1.48.0", features = [
    "macros",
    "rt-multi-thread",
    "io-util",
] }

# Utilities
tokio-util = { version = "0.7.17", features = ["io"] }
bytes = "1.11.0"
futures-util = "0.3.31"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"

# S3
aws-config = "1.8.12"
aws-sdk-s3 = "1.119.0"

# MIME type detection
mime_guess = "2.0.5"

# Database
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
] }

# Error handling
thiserror = "2.0.17"

# Tools
uuid = { version = "1.4.1", features = ["v4"] }
chrono = "0.4.31"
async-trait = "*"
base64 = "0.22.1"
rand = "0.9.2"
hex = "0.4.3"
sha2 = "0.10.9"
subtle = "2.6.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
tracing-actix-web = "0.7"

[build-dependencies]
tonic-prost-build = "0.14.2"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
