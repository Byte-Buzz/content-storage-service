[package]
name = "content-storage-service"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
actix-web = "4.12.1"

# Async runtime
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

# Utilities
tokio-util = { version = "0.7.17", features = ["io"] }
bytes = "1.11.0"
futures-util = "0.3.31"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# AWS SDK
aws-config = "1.8.12"
aws-sdk-s3 = "1.118.0"

# MIME type detection
mime_guess = "2.0.5"

# Database
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
] }

# Logging
env_logger = "0.11.8"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
